<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advocat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<script>
(function () {
  // ── GitHub Pages 404 → SPA-style routing ─────────────────────────────
  // GH Pages serves this file for any path that doesn't map to a static
  // asset. We use it for three things:
  //
  //   1. /s/<8-char-slug>      → /share.html?s=<slug>  (Share-this-analysis)
  //   2. SPA deep-links        → /app.html  (Flutter shell picks up the
  //                              original path via sessionStorage, then
  //                              GoRouter hands off to the right screen).
  //                              Pre-generated <route>.html stubs cover the
  //                              probed deep-links so the smoke gets 200,
  //                              but unknown dynamic IDs (e.g. real draft
  //                              UUIDs) still land here — we redirect them
  //                              to /app.html so users don't see "Page not
  //                              found" while the SPA boots.
  //
  // Anything else falls through to a normal "page not found" view.
  var path = window.location.pathname || '';
  var search = window.location.search || '';
  var hash = window.location.hash || '';

  // Share routing: /s/<slug> with optional trailing slash.
  var share = path.match(/^\/s\/([0-9A-Za-z]{8})\/?$/);
  if (share) {
    var slug = share[1];
    var target = '/share.html?s=' + encodeURIComponent(slug) + search + hash;
    window.location.replace(target);
    return;
  }

  // SPA deep-link fallback. Keep this list in sync with the GoRouter routes
  // in lib/config/router.dart. Top-level segment match is enough — nested
  // dynamic params (/drafts/<uuid>, /cases-v2/<id>/timeline, ...) are
  // implicit since we only match the first segment.
  var SPA_ROUTES = [
    'drafts', 'vault', 'contract-review', 'chat', 'inbox', 'deadlines',
    'cases', 'cases-v2', 'case-file', 'case', 'settings', 'subscription',
    'email', 'rights', 'legal-aid', 'referral', 'firm', 'checker',
    'landmarks', 'scan', 'home', 'profile', 'admin', 'legal', 'lawyers',
    'book-lawyer', 'partner-lawyer', 'for-firms', 'oauth'
  ];
  var seg = path.replace(/^\//, '').split('/')[0];
  if (seg && SPA_ROUTES.indexOf(seg) !== -1) {
    // Stash the original path so the SPA can restore deep-link state
    // even though the URL becomes /app.html after redirect.
    try {
      sessionStorage.setItem('advocat_spa_redirect', path + search + hash);
    } catch (e) { /* private mode */ }
    window.location.replace('/app.html' + search + hash);
    return;
  }
})();
</script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif;
         display: flex; align-items: center; justify-content: center;
         min-height: 100vh; margin: 0; background: #F8FAFC; color: #0F172A; }
  .box { text-align: center; padding: 40px; }
  h1 { font-size: 32px; margin-bottom: 12px; }
  p { color: #64748B; margin-bottom: 20px; }
  a { color: #0F766E; font-weight: 600; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
<!-- Analytics: GA4 + Meta + TikTok pixels (consent-gated) + UTM capture.
     All vendor scripts are loaded conditionally inside _analytics.js
     after the cookie banner records "accept" in advocat_cookie_consent_v1. -->
<script src="/_utm_capture.js"></script>
<script src="/_analytics.js" defer></script>
</head>
<body>
  <div class="box">
    <h1>Page not found</h1>
    <p>This page doesn't exist.</p>
    <a href="/">Back to Advocat →</a>
  </div>
</body>
</html>
