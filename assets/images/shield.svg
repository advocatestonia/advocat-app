<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Advocat shield">
  <defs>
    <linearGradient id="shieldBody" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#1A365D"/>
      <stop offset="100%" stop-color="#0B7A70"/>
    </linearGradient>
    <linearGradient id="shieldHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shieldShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Heater shield silhouette: flat top, curved sides converging to a point -->
  <g filter="url(#shieldShadow)">
    <path d="M128 28
             C 174 28 208 38 224 46
             L 224 124
             C 224 178 196 214 128 232
             C 60 214 32 178 32 124
             L 32 46
             C 48 38 82 28 128 28 Z"
          fill="url(#shieldBody)"/>
    <path d="M128 28
             C 174 28 208 38 224 46
             L 224 124
             C 224 178 196 214 128 232
             C 60 214 32 178 32 124
             L 32 46
             C 48 38 82 28 128 28 Z"
          fill="url(#shieldHighlight)"/>
  </g>
  <!-- Scales of justice emblem (white) -->
  <g fill="#ffffff" fill-opacity="0.96">
    <!-- Central post -->
    <rect x="125" y="78" width="6" height="74" rx="1.5"/>
    <!-- Top knob -->
    <circle cx="128" cy="76" r="5"/>
    <!-- Horizontal beam -->
    <rect x="76" y="92" width="104" height="4" rx="1.5"/>
    <!-- Left pan + chain -->
    <line x1="92" y1="96" x2="92" y2="112" stroke="#ffffff" stroke-width="1.4" stroke-opacity="0.85"/>
    <path d="M76 112 L108 112 L102 130 Q92 138 82 130 Z" fill="#ffffff" fill-opacity="0.92"/>
    <!-- Right pan + chain -->
    <line x1="164" y1="96" x2="164" y2="112" stroke="#ffffff" stroke-width="1.4" stroke-opacity="0.85"/>
    <path d="M148 112 L180 112 L174 130 Q164 138 154 130 Z" fill="#ffffff" fill-opacity="0.92"/>
    <!-- Base -->
    <rect x="116" y="150" width="24" height="6" rx="2"/>
    <rect x="108" y="156" width="40" height="4" rx="1.5"/>
  </g>
</svg>
