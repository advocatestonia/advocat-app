function setLang(lang){
  const t=T[lang];if(!t)return;
  document.documentElement.lang=lang;
  document.documentElement.dir=(lang==='ar'||lang==='fa')?'rtl':'ltr';
  document.getElementById('mission-full').textContent=t.mission;
  document.getElementById('mission-short').textContent=t.missionShort;
  document.getElementById('cta-btn').textContent=t.cta;
  document.getElementById('cta-sub').textContent=t.sub;
  document.getElementById('footer').textContent=t.disclaimer;
  document.getElementById('stat-jurisdictions').textContent=t.jurisdictions;
  document.getElementById('stat-templates').textContent=t.templates;
  document.getElementById('stat-scenarios').textContent=t.scenarios;
  document.getElementById('stat-languages').textContent=t.languages;
  var blogMap={et:'/blog/',ru:'/blog/ru/',en:'/blog/en/'};
  document.getElementById('articles-title').textContent=t.articlesTitle||T.en.articlesTitle;
  var allLink=document.getElementById('articles-all');
  allLink.textContent=t.articlesAll||T.en.articlesAll;
  allLink.href=blogMap[lang]||'/blog/en/';
  var grid=document.getElementById('articles-grid');
  grid.innerHTML='';
  for(var i=1;i<=3;i++){
    var tag=t['art'+i+'Tag']||T.en['art'+i+'Tag'];
    var title=t['art'+i+'Title']||T.en['art'+i+'Title'];
    var desc=t['art'+i+'Desc']||T.en['art'+i+'Desc'];
    var url=t['art'+i+'Url']||T.en['art'+i+'Url'];
    var a=document.createElement('a');
    a.className='article-card';
    a.href=url;
    a.innerHTML='<div class="tag">'+tag+'</div><h3>'+title+'</h3><p>'+desc+'</p>';
    grid.appendChild(a);
  }
  document.getElementById('cta-btn').href='/app.html?lang='+lang;
  document.querySelectorAll('.lang-btn').forEach(function(b){
    b.classList.toggle('active',b.dataset.lang===lang);
  });
  try{localStorage.setItem('advocat-lang',lang);localStorage.setItem('advocat_lang',lang)}catch(e){}
}

(function(){
  var lang='et';
  try{var s=localStorage.getItem('advocat-lang');if(s&&T[s])lang=s;}catch(e){}
  if(lang==='et'){
    var nav=(navigator.language||'').toLowerCase();
    if(nav.startsWith('ru'))lang='ru';
    else if(nav.startsWith('uk'))lang='uk';
    else if(nav.startsWith('fi'))lang='fi';
    else if(nav.startsWith('et'))lang='et';
    else if(nav.startsWith('sv'))lang='sv';
    else if(nav.startsWith('de'))lang='de';
    else if(nav.startsWith('ar'))lang='ar';
    else if(nav.startsWith('pl'))lang='pl';
    else if(nav.startsWith('fr'))lang='fr';
    else if(nav.startsWith('fa'))lang='fa';
    else if(nav.startsWith('tr'))lang='tr';
    else if(nav.startsWith('lv'))lang='lv';
    else if(nav.startsWith('lt'))lang='lt';
    else if(nav.startsWith('es'))lang='es';
    else if(nav.startsWith('it'))lang='it';
    else if(nav.startsWith('ro'))lang='ro';
  }
  setLang(lang);
})();
</script>
