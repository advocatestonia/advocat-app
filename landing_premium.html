<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#F0EEEB;--text:#1A365D;--accent:#0D9488;--card:#FFFFFF;--accent-glow:rgba(13,148,136,0.3);--surface:rgba(255,255,255,0.7)}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text);background:var(--bg);overflow-x:hidden;min-height:100vh}

/* Animated gradient background */
.bg-gradient{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#F0EEEB 0%,#E8E6E3 25%,#E0DEE4 50%,#E8E6E3 75%,#F0EEEB 100%);background-size:400% 400%;animation:bgShift 20s ease infinite;z-index:-2}
@keyframes bgShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

/* Floating particles */
.particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.particle{position:absolute;width:4px;height:4px;background:var(--accent);border-radius:50%;opacity:0.12;animation:float linear infinite}
.particle:nth-child(1){left:10%;top:20%;animation-duration:18s;animation-delay:0s;width:6px;height:6px}
.particle:nth-child(2){left:25%;top:60%;animation-duration:22s;animation-delay:2s}
.particle:nth-child(3){left:45%;top:30%;animation-duration:16s;animation-delay:4s;width:5px;height:5px}
.particle:nth-child(4){left:65%;top:70%;animation-duration:20s;animation-delay:1s}
.particle:nth-child(5){left:80%;top:15%;animation-duration:24s;animation-delay:3s;width:7px;height:7px}
.particle:nth-child(6){left:90%;top:50%;animation-duration:19s;animation-delay:5s}
.particle:nth-child(7){left:5%;top:80%;animation-duration:21s;animation-delay:2s;width:5px;height:5px}
.particle:nth-child(8){left:55%;top:90%;animation-duration:17s;animation-delay:4s}
@keyframes float{0%{transform:translateY(0) translateX(0);opacity:0.12}25%{transform:translateY(-120px) translateX(30px);opacity:0.2}50%{transform:translateY(-240px) translateX(-20px);opacity:0.08}75%{transform:translateY(-360px) translateX(40px);opacity:0.15}100%{transform:translateY(-480px) translateX(0);opacity:0.05}}

.page{max-width:960px;margin:0 auto;padding:0 24px}

/* Hero section */
.hero{text-align:center;padding:60px 0 40px;position:relative}
.logo-wrap{position:relative;display:inline-block;margin-bottom:32px}
.glow-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(13,148,136,0.25) 0%,rgba(13,148,136,0.08) 40%,transparent 70%);animation:pulseGlow 3s ease-in-out infinite;z-index:0;pointer-events:none}
@keyframes pulseGlow{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.7}50%{transform:translate(-50%,-50%) scale(1.15);opacity:1}}
.logo-wrap img{width:160px;height:160px;position:relative;z-index:1;border-radius:28px}

.headline{font-size:clamp(28px,5vw,48px);font-weight:800;line-height:1.15;margin-bottom:16px;background:linear-gradient(90deg,var(--text),var(--accent),var(--text));background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 4s linear infinite}
@keyframes shimmer{0%{background-position:0% center}100%{background-position:200% center}}

.subtitle{font-size:clamp(14px,2vw,17px);color:var(--text);opacity:0.7;margin-bottom:28px;letter-spacing:0.5px;font-weight:500}
.subtitle span{color:var(--accent);font-weight:700;opacity:1}

/* Language switcher */
.langs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-bottom:40px}
.lang-btn{appearance:none;border:1.5px solid rgba(26,53,93,0.15);background:var(--surface);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--text);font-family:inherit;font-size:13px;font-weight:500;padding:6px 14px;border-radius:20px;cursor:pointer;transition:all .25s ease;white-space:nowrap}
.lang-btn:hover{border-color:var(--accent);box-shadow:0 4px 16px var(--accent-glow);transform:translateY(-2px)}
.lang-btn.active{border-color:var(--accent);background:rgba(13,148,136,0.1);color:var(--accent);font-weight:600;box-shadow:0 2px 12px var(--accent-glow)}

/* Stats section */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:56px}
.stat-card{background:var(--surface);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:16px;padding:24px 12px;text-align:center;border:1px solid rgba(255,255,255,0.6);box-shadow:0 4px 24px rgba(26,53,93,0.06);transition:transform .3s ease}
.stat-card:hover{transform:translateY(-4px)}
.stat-num{font-size:clamp(24px,4vw,36px);font-weight:800;color:var(--accent);line-height:1.2}
.stat-label{font-size:11px;color:var(--text);opacity:0.6;margin-top:4px;font-weight:500}

/* Features section */
.features{margin-bottom:56px}
.features-title{text-align:center;font-size:clamp(22px,3.5vw,32px);font-weight:700;margin-bottom:32px}
.features-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.feature-card{background:var(--surface);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:20px;padding:32px 24px;text-align:center;border:1px solid rgba(255,255,255,0.6);box-shadow:0 4px 24px rgba(26,53,93,0.06);transition:all .35s ease;cursor:default}
.feature-card:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 12px 40px rgba(13,148,136,0.15)}
.feature-icon{width:56px;height:56px;margin:0 auto 16px;background:linear-gradient(135deg,var(--text),var(--accent));border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff}
.feature-name{font-size:18px;font-weight:700;margin-bottom:8px}
.feature-desc{font-size:14px;line-height:1.6;opacity:0.7}

/* Trust section */
.trust{display:flex;justify-content:center;gap:32px;flex-wrap:wrap;margin-bottom:56px;padding:24px 0}
.trust-badge{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text);opacity:0.65}
.trust-badge svg{width:20px;height:20px;fill:var(--accent)}

/* CTA section */
.cta-section{text-align:center;padding:48px 0;margin-bottom:40px;background:var(--surface);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:24px;border:1px solid rgba(255,255,255,0.6);box-shadow:0 8px 40px rgba(26,53,93,0.06)}
.cta-heading{font-size:clamp(20px,3vw,28px);font-weight:700;margin-bottom:24px}
.cta-btn{display:inline-block;background:linear-gradient(135deg,var(--accent),#0077FF);color:#fff;font-family:inherit;font-size:18px;font-weight:700;padding:16px 40px;border-radius:14px;text-decoration:none;box-shadow:0 4px 24px var(--accent-glow);transition:all .3s ease;animation:breathe 3s ease-in-out infinite}
.cta-btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 8px 36px rgba(13,148,136,0.4)}
@keyframes breathe{0%,100%{box-shadow:0 4px 24px var(--accent-glow)}50%{box-shadow:0 4px 36px rgba(13,148,136,0.45)}}
.cta-sub{display:block;font-size:13px;color:var(--text);opacity:0.5;margin-top:12px;font-weight:500}

/* Footer */
.footer{text-align:center;padding:24px;font-size:12px;color:var(--text);opacity:0.4;border-top:1px solid rgba(26,53,93,0.08)}
.footer a{color:var(--accent);text-decoration:none;font-weight:500}
.footer a:hover{text-decoration:underline}
.footer-links{margin-top:4px}
.footer-links a{margin:0 8px}

/* Fade-in animations */
.fade-up{opacity:0;transform:translateY(30px);transition:opacity 0.7s ease,transform 0.7s ease}
.fade-up.visible{opacity:1;transform:translateY(0)}
.fade-up.d1{transition-delay:0.1s}.fade-up.d2{transition-delay:0.2s}.fade-up.d3{transition-delay:0.3s}.fade-up.d4{transition-delay:0.4s}

/* Responsive */
@media(max-width:768px){
  .hero{padding:40px 0 24px}
  .stats{grid-template-columns:repeat(2,1fr);gap:12px}
  .features-grid{grid-template-columns:1fr;gap:16px}
  .trust{gap:20px}
  .glow-ring{width:180px;height:180px}
  .logo-wrap img{width:130px;height:130px}
}
@media(max-width:480px){
  .hero{padding:32px 0 20px}
  .langs{gap:4px}
  .lang-btn{font-size:10px;padding:4px 9px}
  .stat-card{padding:16px 8px}
  .cta-btn{font-size:15px;padding:14px 28px}
  .trust{flex-direction:column;align-items:center;gap:12px}
}
html[dir="rtl"] body{direction:rtl}
html[dir="rtl"] .trust-badge{flex-direction:row-reverse}
/* Articles section */
.articles{margin-bottom:40px}
.articles-title{text-align:center;font-size:clamp(18px,2.5vw,24px);font-weight:600;margin-bottom:24px;opacity:0.8}
.articles-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.article-card{background:var(--surface);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:16px;padding:24px 20px;border:1px solid rgba(255,255,255,0.6);box-shadow:0 2px 12px rgba(26,53,93,0.04);transition:all .3s ease;text-decoration:none;color:var(--text);display:block}
.article-card:hover{transform:translateY(-4px);box-shadow:0 8px 28px rgba(13,148,136,0.12);border-color:rgba(13,148,136,0.2)}
.article-tag{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;padding:3px 8px;border-radius:12px;margin-bottom:10px;background:rgba(13,148,136,0.08);color:var(--accent)}
.article-card h3{font-size:15px;font-weight:700;line-height:1.4;margin-bottom:6px}
.article-card p{font-size:13px;opacity:0.6;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.articles-all{display:block;text-align:center;margin-top:20px;font-size:14px;font-weight:600;color:var(--accent);text-decoration:none}
.articles-all:hover{text-decoration:underline}
@media(max-width:768px){.articles-grid{grid-template-columns:1fr;gap:12px}}
</style>
</head>

/* Apply translations */
function setLang(lang){
  const t=T[lang];if(!t)return;
  document.documentElement.lang=lang;
  document.documentElement.dir=(lang==='ar'||lang==='fa')?'rtl':'ltr';
  document.getElementById('headline').textContent=t.headline;
  document.getElementById('sub-db').textContent=t.subDb;
  document.getElementById('sub-countries').textContent=t.subCountries;
  document.getElementById('sub-langs').textContent=t.subLangs;
  document.getElementById('stat-tokens').textContent=t.statTokens;
  document.getElementById('stat-countries').textContent=t.statCountries;
  document.getElementById('stat-languages').textContent=t.statLanguages;
  document.getElementById('stat-availability').textContent=t.statAvailability;
  document.getElementById('features-title').textContent=t.featuresTitle;
  document.getElementById('f1-name').textContent=t.f1Name;
  document.getElementById('f1-desc').textContent=t.f1Desc;
  document.getElementById('f2-name').textContent=t.f2Name;
  document.getElementById('f2-desc').textContent=t.f2Desc;
  document.getElementById('f3-name').textContent=t.f3Name;
  document.getElementById('f3-desc').textContent=t.f3Desc;
  document.getElementById('trust-1').textContent=t.trust1;
  document.getElementById('trust-2').textContent=t.trust2;
  document.getElementById('trust-3').textContent=t.trust3;
  document.getElementById('cta-heading').textContent=t.ctaHeading;
  document.getElementById('cta-btn').textContent=t.cta;
  document.getElementById('cta-btn').href='/app.html?lang='+lang+'#/login';
  document.getElementById('cta-sub').textContent=t.sub;
  document.getElementById('footer-disclaimer').textContent=t.disclaimer;
  // Articles section
  document.getElementById('articles-title').textContent=t.articlesTitle||T.en.articlesTitle;
  var allLink=document.getElementById('articles-all');
  allLink.textContent=t.articlesAll||T.en.articlesAll;
  var blogMap={et:'/blog/',ru:'/blog/ru/',en:'/blog/en/'};
  allLink.href=blogMap[lang]||'/blog/en/';
  var grid=document.getElementById('articles-grid');
  grid.innerHTML='';
  for(var i=1;i<=3;i++){
    var tag=t['art'+i+'Tag']||T.en['art'+i+'Tag'];
    var title=t['art'+i+'Title']||T.en['art'+i+'Title'];
    var desc=t['art'+i+'Desc']||T.en['art'+i+'Desc'];
    var url=t['art'+i+'Url']||T.en['art'+i+'Url'];
    var card=document.createElement('a');
    card.className='article-card';
    card.href=url;
    card.innerHTML='<span class="article-tag">'+tag+'</span><h3>'+title+'</h3><p>'+desc+'</p>';
    grid.appendChild(card);
  }
  var fb=document.getElementById('footer-blog');
  if(fb)fb.href=blogMap[lang]||'/blog/en/';
  document.querySelectorAll('.lang-btn').forEach(function(b){
    b.classList.toggle('active',b.dataset.lang===lang);
  });
  try{localStorage.setItem('advocat-lang',lang)}catch(e){}
}

/* Animated counters */
function animateCounters(){
  document.querySelectorAll('.stat-num[data-target]').forEach(function(el){
    const target=parseInt(el.dataset.target);
    const duration=1800;
    const start=performance.now();
    const suffix=target===1000000?'+':'';
    function step(now){
      const elapsed=now-start;
      const progress=Math.min(elapsed/duration,1);
      const eased=1-Math.pow(1-progress,3);
      const current=Math.floor(eased*target);
      el.textContent=(target>=1000?current.toLocaleString():current)+suffix;
      if(progress<1)requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

/* Intersection Observer for fade-in and counter trigger */
const observer=new IntersectionObserver(function(entries){
  entries.forEach(function(entry){
    if(entry.isIntersecting){
      entry.target.classList.add('visible');
      if(entry.target.classList.contains('stats')){animateCounters();}
      observer.unobserve(entry.target);
    }
  });
},{threshold:0.15});

document.querySelectorAll('.fade-up').forEach(function(el){observer.observe(el);});

/* Auto-detect language */
(function(){
  var lang='en';
  try{var s=localStorage.getItem('advocat-lang');if(s&&T[s])lang=s;}catch(e){}
  if(lang==='en'){
    var nav=(navigator.language||'').toLowerCase();
    var map={ru:'ru',uk:'uk',fi:'fi',et:'et',sv:'sv',de:'de',ar:'ar',pl:'pl',fr:'fr',fa:'fa',tr:'tr',lv:'lv',lt:'lt',es:'es',it:'it',ro:'ro'};
    for(var k in map){if(nav.startsWith(k)){lang=map[k];break;}}
  }
  setLang(lang);
})();
</script>
