name: advocat
description: AI-powered legal assistant for all legal matters.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Backend & Auth
  supabase_flutter: ^2.5.0

  # Payments
  flutter_stripe: ^10.1.1

  # Firebase
  firebase_core: ^2.30.0
  firebase_messaging: ^14.8.0

  # Camera & Documents
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  flutter_pdfview: ^1.3.2
  google_mlkit_text_recognition: ^0.12.0

  # Networking
  dio: ^5.4.1

  # Storage & Security
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Localization
  intl: ^0.20.2

  # Sharing
  share_plus: ^10.0.0

  # UI Utilities
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0

  # Voice
  speech_to_text: ^6.6.0
  flutter_tts: ^4.0.2

  # Utilities
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  path_provider: ^2.1.2
  url_launcher: ^6.2.4
  permission_handler: ^11.3.0
  connectivity_plus: ^6.0.2
  logger: ^2.0.2+1
  uuid: ^4.3.3
  timeago: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  riverpod_generator: ^2.4.0
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/images/illustrations/
    - assets/icons/
    - assets/l10n/
    - assets/legal/estonia/
    - assets/legal/finland/

  # Fonts loaded via google_fonts package at runtime
