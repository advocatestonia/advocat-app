<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Advocat Pro shield">
  <defs>
    <linearGradient id="proBody" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#1A365D"/>
      <stop offset="100%" stop-color="#0B7A70"/>
    </linearGradient>
    <linearGradient id="proRim" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="proHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="proShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5"/>
      <feOffset dx="0" dy="4" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.32"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Outer rim (light) -->
  <g filter="url(#proShadow)">
    <path d="M128 22
             C 178 22 214 32 232 42
             L 232 126
             C 232 184 200 222 128 240
             C 56 222 24 184 24 126
             L 24 42
             C 42 32 78 22 128 22 Z"
          fill="url(#proRim)"/>
    <!-- Inner body -->
    <path d="M128 36
             C 172 36 204 46 220 54
             L 220 124
             C 220 174 192 208 128 224
             C 64 208 36 174 36 124
             L 36 54
             C 52 46 84 36 128 36 Z"
          fill="url(#proBody)"/>
    <path d="M128 36
             C 172 36 204 46 220 54
             L 220 124
             C 220 174 192 208 128 224
             C 64 208 36 174 36 124
             L 36 54
             C 52 46 84 36 128 36 Z"
          fill="url(#proHighlight)"/>
  </g>
  <!-- 5-point star (white) -->
  <path d="M128 82
           L141.5 122.4
           L184 122.4
           L149.75 147.4
           L162.9 187.8
           L128 162.7
           L93.1 187.8
           L106.25 147.4
           L72 122.4
           L114.5 122.4 Z"
        fill="#ffffff" fill-opacity="0.97"/>
</svg>
