<?xml version="1.0" encoding="UTF-8"?>
<!--
  Advocat shield mark — navy→teal gradient with white scales of justice.
  ViewBox tuned to 320×320 for 1:1 aspect. Scales crisply at any size.
  Colors: navy #1A365D, navy-dark #0A1628, teal #0D9488, gold #D69E2E.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Advocat shield">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="45%" stop-color="#1A365D"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="shieldEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8C66B"/>
      <stop offset="55%" stop-color="#D69E2E"/>
      <stop offset="100%" stop-color="#9C7319"/>
    </linearGradient>
    <linearGradient id="innerHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Shield outline (path): classic heater shield, slightly rounded shoulders, pointed base -->
  <!-- Outer gold frame -->
  <path d="M 60 50
           L 260 50
           Q 270 50 270 62
           L 270 158
           Q 270 220 222 258
           Q 180 292 160 298
           Q 140 292 98 258
           Q 50 220 50 158
           L 50 62
           Q 50 50 60 50 Z"
        fill="url(#shieldEdge)"/>

  <!-- Inner shield body -->
  <path d="M 68 58
           L 252 58
           Q 258 58 258 66
           L 258 158
           Q 258 215 215 249
           Q 178 281 160 287
           Q 142 281 105 249
           Q 62 215 62 158
           L 62 66
           Q 62 58 68 58 Z"
        fill="url(#shieldGrad)"/>

  <!-- Highlight sheen across top -->
  <path d="M 68 58
           L 252 58
           Q 258 58 258 66
           L 258 150
           Q 258 170 160 175
           Q 62 170 62 150
           L 62 66
           Q 62 58 68 58 Z"
        fill="url(#innerHighlight)"/>

  <!-- Scales of justice -->
  <g fill="#FFFFFF" stroke="none">
    <!-- Central pillar / pole -->
    <rect x="156" y="105" width="8" height="96" rx="1.5"/>
    <!-- Top knob on pillar -->
    <circle cx="160" cy="103" r="5"/>
    <!-- Base stand -->
    <rect x="140" y="200" width="40" height="5" rx="1"/>
    <rect x="146" y="205" width="28" height="4" rx="1"/>
    <!-- Horizontal beam -->
    <rect x="90" y="118" width="140" height="5" rx="1.5"/>
    <!-- Left hanging chain -->
    <line x1="100" y1="123" x2="100" y2="138" stroke="#FFFFFF" stroke-width="1.5"/>
    <!-- Right hanging chain -->
    <line x1="220" y1="123" x2="220" y2="138" stroke="#FFFFFF" stroke-width="1.5"/>
    <!-- Left pan (trapezoid) -->
    <path d="M 82 138 L 118 138 L 112 158 L 88 158 Z"/>
    <!-- Left pan curved bottom -->
    <path d="M 88 158 Q 100 170 112 158 Z" fill="#F2F4F8"/>
    <!-- Right pan (trapezoid) -->
    <path d="M 202 138 L 238 138 L 232 158 L 208 158 Z"/>
    <!-- Right pan curved bottom -->
    <path d="M 208 158 Q 220 170 232 158 Z" fill="#F2F4F8"/>
  </g>
</svg>
