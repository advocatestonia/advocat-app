<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Advocat — Your friend invited you</title>

  <!--
    Referral landing.

    URL shape:   https://advocat.ee/r/<code>
                 (GitHub Pages serves r.html for that exact path; we also
                 accept ?ref=<code> as a fallback when the .htaccess-style
                 path rewrite is not available — e.g. when previewing
                 locally with `flutter run -d chrome`.)

    Behaviour:
      1. Extract the 6-16 char alphanumeric code from either:
           * the pathname  (/r/<code>)
           * the query     (?ref=<code> or ?r=<code>)
      2. Store it under localStorage key `advocat_referral_code` so the
         signup flow can read it and POST /referral/attribute after the
         user authenticates.
      3. Redirect to /app.html with `?ref=<code>&utm_source=referral`
         appended so the analytics layer (when present) can credit the
         loop.

    All three steps are best-effort. If localStorage is disabled the code
    still rides on the URL into /app.html which keeps the loop functional.
  -->

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #0a1929 0%, #134672 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
    }
    .card {
      padding: 24px;
      max-width: 420px;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 8px;
      font-weight: 600;
    }
    p {
      opacity: 0.85;
      margin: 0 0 24px;
      line-height: 1.5;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 24px auto 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
<!-- Analytics: GA4 + Meta + TikTok pixels (consent-gated) + UTM capture.
     All vendor scripts are loaded conditionally inside _analytics.js
     after the cookie banner records "accept" in advocat_cookie_consent_v1. -->
<!-- Cookie consent (W2-13): per-jurisdiction granular banner. MUST load before
     _utm_capture.js and _analytics.js so consent gates every pixel. -->
<script src="/_cookie_consent.js" defer></script>
<script src="/_utm_capture.js"></script>
<script src="/_analytics.js" defer></script>
</head>
<body>
  <div class="card">
    <h1>Welcome to Advocat</h1>
    <p>Your friend invited you. We are setting up your free month…</p>
    <div class="spinner" aria-hidden="true"></div>
  </div>

  <script>
    (function () {
      "use strict";

      // 6-16 lowercase alphanumeric — matches the DB CHECK constraint.
      var CODE_RE = /^[a-z0-9]{6,16}$/;

      function fromPath() {
        try {
          var parts = location.pathname.split("/").filter(Boolean);
          // Expecting ["r", "<code>"]; tolerate hash on either end.
          var idx = parts.indexOf("r");
          if (idx === -1 || idx + 1 >= parts.length) return null;
          return parts[idx + 1];
        } catch (_) {
          return null;
        }
      }

      function fromQuery() {
        try {
          var sp = new URLSearchParams(location.search);
          return sp.get("ref") || sp.get("r") || null;
        } catch (_) {
          return null;
        }
      }

      var raw = (fromPath() || fromQuery() || "").trim().toLowerCase();
      var code = CODE_RE.test(raw) ? raw : "";

      // Best-effort: storage may be blocked (Safari private mode,
      // 3rd-party-cookie blockers, etc.). Failure here is non-fatal.
      if (code) {
        try {
          localStorage.setItem("advocat_referral_code", code);
          // Also stash an ISO timestamp so the signup flow can age the
          // attribution out (e.g. 30-day window) if it ever needs to.
          localStorage.setItem(
            "advocat_referral_code_saved_at",
            new Date().toISOString()
          );
        } catch (_) { /* ignore */ }
      }

      // Forward to the app. Preserve the code on the URL too so first-party
      // localStorage blockers still see it via location.search.
      var target = "/app.html";
      if (code) {
        target += "?ref=" + encodeURIComponent(code) +
                  "&utm_source=referral";
      }
      // Use replace() so the back button skips this redirect page.
      location.replace(target);
    })();
  </script>
</body>
</html>
