# Supabase project configuration
# Project ref: okgnkucgwsytsondrjye
# Created: 2026-05-28 — security audit INFRA-02 (dep pinning)
# Updated: 2026-05-29 — migrated to per-function schema for Supabase CLI v2.84+
#
# This file is consumed by the Supabase CLI. CLI v2.84+ dropped the global
# [functions] block; import_map / verify_jwt must now be set per function as
# [functions.<name>]. We keep INFRA-02's supply-chain lock by pinning the
# shared import_map on EVERY function below. See functions/IMPORT_MAP_README.md.
#
# verify_jwt is intentionally NOT set here: each function's gateway JWT setting
# is managed in the Supabase dashboard (public webhooks like stripe-webhook /
# apple-iap-verify / oauth-callback must stay verify_jwt=false and verify their
# own signatures). Re-asserting verify_jwt=true globally would break them.
#
# NOTE: when adding a NEW edge function, add a [functions.<name>] block here so
# it inherits the pinned import_map. canary-deploy.sh does not pass --import-map.

project_id = "okgnkucgwsytsondrjye"

