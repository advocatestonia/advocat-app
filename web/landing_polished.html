*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#F0EEEB;--text:#1A2B4A;--accent:#0D9488;--card:#FFFFFF;--accent-glow:rgba(13,148,136,0.25);--accent-light:rgba(13,148,136,0.08)}

body{margin:0;padding:0}
.page{max-width:900px;margin:0 auto;padding:40px 20px 20px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;min-height:100vh;justify-content:center;animation:fadeUp 1.2s ease-out}

.logo{margin:0 0 30px 0;padding:0;line-height:0}
.logo img{width:100%;max-width:420px;height:auto;display:block;margin:0 auto;filter:drop-shadow(0 0 40px rgba(13,148,136,0.35)) drop-shadow(0 0 80px rgba(13,148,136,0.15));animation:logoGlow 3s ease-in-out infinite}

.langs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:0;margin:0 0 30px 0}
.lang-btn{appearance:none;border:1.5px solid rgba(26,43,74,0.2);background:transparent;color:var(--text);font-family:inherit;font-size:13px;font-weight:500;padding:6px 14px;border-radius:20px;cursor:pointer;transition:all .2s;white-space:nowrap;box-shadow:0 1px 3px rgba(26,43,74,0.06)}
.lang-btn:hover{border-color:var(--accent);box-shadow:0 2px 10px var(--accent-glow);transform:translateY(-1px)}
.lang-btn.active{border-color:var(--accent);background:var(--accent-light);color:var(--accent);font-weight:600;box-shadow:0 2px 10px var(--accent-glow)}
.headline{font-size:26px;font-weight:800;color:var(--text);letter-spacing:0.3px;margin:0 0 6px 0;line-height:1.3}
.subtitle{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--accent);opacity:0.7;margin:0 0 18px 0}
.mission{font-size:15px;line-height:1.7;color:var(--text);opacity:0.85;max-width:560px;margin:0 auto 30px auto;padding:0 10px}
.mission-short{display:none}
.stats{display:flex;justify-content:center;gap:28px;margin:0 0 30px 0}
.stat-num{font-size:24px;font-weight:700;color:var(--accent)}
.stat-label{font-size:10px;color:var(--text);opacity:0.6;margin-top:2px}
.cta-wrap{margin:0 0 20px 0}
.cta-btn{display:inline-block;background:var(--accent);color:#fff;font-family:inherit;font-size:16px;font-weight:600;padding:12px 32px;border-radius:12px;text-decoration:none;box-shadow:0 4px 20px var(--accent-glow);animation:ctaPulse 2.5s ease-in-out infinite;transition:all .3s ease}
.cta-btn:hover{transform:translateY(-2px);box-shadow:0 6px 25px rgba(13,148,136,0.4)}
.cta-btn:active{transform:translateY(0);box-shadow:0 2px 10px var(--accent-glow)}
@keyframes ctaPulse{0%{box-shadow:0 4px 20px var(--accent-glow),0 0 0 0 rgba(13,148,136,0.35)}50%{box-shadow:0 4px 20px var(--accent-glow),0 0 0 10px rgba(13,148,136,0)}100%{box-shadow:0 4px 20px var(--accent-glow),0 0 0 0 rgba(13,148,136,0)}}
.cta-sub{display:block;font-size:11px;color:var(--text);opacity:0.5;margin-top:6px}
.footer{font-size:8px;color:var(--text);opacity:0.35;text-align:center;padding:6px}
.footer a{color:var(--accent);text-decoration:none}
.footer-extra{font-size:9px;color:var(--text);opacity:0.35;text-align:center;padding:2px 6px 8px 6px}
.footer-extra a{color:var(--accent);text-decoration:none}
@media(max-width:480px){
  .page{padding:20px 16px 16px 16px;justify-content:flex-start}
  .logo{margin:0 0 20px 0}
  .logo img{max-width:280px}
  .langs{gap:4px;margin:0 0 20px 0}
  .lang-btn{font-size:10px;padding:4px 10px}
  .headline{font-size:22px;margin:0 0 4px 0}
  .subtitle{font-size:10px;margin:0 0 14px 0}
  .mission{font-size:13px;margin:0 auto 20px auto;line-height:1.6}
  .mission-full{display:none}
  .mission-short{display:inline}
  .stats{gap:16px;margin:0 0 24px 0}
  .stat-num{font-size:18px}
  .stat-label{font-size:9px}
  .cta-btn{font-size:14px;padding:11px 28px}
  .cta-wrap{margin:0 0 16px 0}
}
html[dir="rtl"] body{direction:rtl}
</style>

  }
  setLang(lang);
})();
