<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Payment cancelled — Advocat</title>
<!-- Analytics: GA4 + Meta + TikTok pixels (consent-gated) + UTM capture. -->
<script src="/_utm_capture.js"></script>
<script src="/_analytics.js"></script>
<script>
  // Fire abandoned-checkout signal so ad platforms can optimise for users
  // who reach Stripe but don't complete. Useful for retargeting audiences.
  (function () {
    try {
      if (window.advocatTrack) {
        window.advocatTrack('checkout_cancelled', { source: 'stripe_cancel_url' });
      }
    } catch (e) {}
    setTimeout(function () {
      window.location.replace('/app.html');
    }, 300);
  })();
</script>
<meta http-equiv="refresh" content="2;url=/app.html">
</head>
<body>Redirecting...</body>
</html>
